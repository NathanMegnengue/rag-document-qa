[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 flags FastAPI's standard Depends()/File() defaults, which are the intended usage.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The handbook text is data: long sentences are fine there.
"evaluation/make_handbook.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
